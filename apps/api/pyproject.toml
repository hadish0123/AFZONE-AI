[project]
name = "primevpn-api"
version = "0.1.0"
description = "PRIMEVPN commercial control plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<46",
  "httpx>=0.28,<1",
  "redis>=6.4,<7",
  "aiogram>=3.22,<4",
  "python-multipart>=0.0.20,<1",
  "pyotp>=2.9,<3",
  "orjson>=3.11,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
